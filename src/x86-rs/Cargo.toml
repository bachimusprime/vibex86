[package]
name = "x86-rs"
version = "0.1.0"
edition = "2024"
description = "Low-level i386 PC CPU: decoder, interpreter, and Cranelift JIT"

[features]
default = ["jit"]
jit = ["dep:cranelift-codegen", "dep:cranelift-frontend", "dep:cranelift-jit", "dep:cranelift-module", "dep:cranelift-native", "dep:target-lexicon"]

[dependencies]
cranelift-codegen = { version = "0.134", optional = true }
cranelift-frontend = { version = "0.134", optional = true }
cranelift-jit = { version = "0.134", optional = true }
cranelift-module = { version = "0.134", optional = true }
cranelift-native = { version = "0.134", optional = true }
target-lexicon = { version = "0.13", optional = true }

[dev-dependencies]
